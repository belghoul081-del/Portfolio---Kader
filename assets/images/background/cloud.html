<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Board Portfolio Background</title>
    <style>
        :root {
            --bg-cyan: #050508;
            --navy: #C5A059;
            --navy-soft: #fdae10;
            --orange: #FF6D00;
            --red: #e2263a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-cyan);
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ---------- BACKGROUND LAYER (fixed, behind everything) ---------- */
        .circuit-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: var(--bg-cyan);
            overflow: hidden;
        }

        .circuit-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Glassmorphism overlay sitting above the raw SVG but below page content */
        .glass-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: rgba(7, 13, 26, 0.7);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        /* ---------- Board base shapes ---------- */
        .board-bg {
            fill: var(--bg-cyan);
        }

        .board-border {
            fill: none;
            stroke: var(--navy);
            stroke-opacity: 0.15;
            stroke-width: 2;
        }

        /* Chips / CPUs -> visible navy */
        .chip-core {
            fill: var(--navy);
            stroke: var(--navy-soft);
            stroke-width: 1.2;
            opacity: 0.92;
        }

        .chip-small {
            fill: var(--navy);
            stroke: var(--navy-soft);
            stroke-width: 0.8;
            opacity: 0.85;
        }

        .chip-strip {
            fill: var(--navy-soft);
            opacity: 0.8;
        }

        /* Decorative pictogram fills + dense grid dots -> essentially hidden but kept in DOM */
        .decor-icon {
            fill: var(--navy);
            opacity: 0.045;
        }

        .circuit-hidden {
            fill: none;
            stroke: var(--navy);
            stroke-width: 0.6;
            opacity: 0.5;
        }

        /* Main circuit paths (feeding the CPU) -> visible navy traces */
        .circuit-path {
            fill: none;
            stroke: var(--navy);
            stroke-width: 1.1;
            stroke-linecap: round;
            transition: stroke 0.15s linear;
        }

        .circuit-path.main-path {
            stroke-opacity: 0.8;
            stroke-width: 1.3;
        }

        /* Secondary paths -> nearly invisible base state, kept for JS pulses */
        .circuit-path.secondary-path {
            stroke-opacity: 0.2;
            stroke-width: 1;
        }

        /* Circular indicator rings -> visible navy w/ faint glow, orange center pulse capable */
        .circle-glow-ring,
        .circle-glow-ring2,
        .circle-glow-ring3 {
            fill: none;
            stroke: var(--navy);
            stroke-width: 1.4;

        }

        .circle-glow-dot,
        .circle-glow-dot2,
        .circle-glow-dot3 {
            fill: var(--orange);
            opacity: 0.85;
            filter: drop-shadow(0 0 4px var(--orange));
        }

        /* ---------- Pulse elements injected by JS ---------- */
        .pulse-line {
            fill: none;
            stroke-linecap: round;
            pointer-events: none;
        }

        .pulse-spark {
            pointer-events: none;
        }

        /* ---------- Page content sits above everything ---------- */
        .page-content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--navy);
            text-align: center;
            padding: 2rem;
        }

        .page-content h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin: 0 0 .5rem;
            letter-spacing: 0.5px;
        }

        .page-content p {
            font-size: 1.1rem;
            max-width: 560px;
            opacity: 0.8;
            margin: 0;
        }
    </style>
</head>

    <script>
        (function () {
            "use strict";

            const svg = document.getElementById("circuitSvg");
            if (!svg) return;

            const NS = "http://www.w3.org/2000/svg";
            const ORANGE = "#FF6D00";
            const RED = "#e2263a";

            /* ---------------------------------------------------------
               1. Gather targets
            --------------------------------------------------------- */
            const mainPaths = Array.from(svg.querySelectorAll("path.circuit-path.main-path"));
            const secondaryPaths = Array.from(svg.querySelectorAll("path.circuit-path.secondary-path"));
            const allPaths = mainPaths.concat(secondaryPaths);

            const circleTargets = [
                { els: ["circle-glow-ring", "circle-glow-dot"], selector: ".circle-glow-ring, .circle-glow-dot" },
            ];

            // Build orbit-capable circle/ellipse groups (center + radius derived straight from SVG attrs)
            function collectOrbitGroups(ringSelector, dotSelector) {
                const rings = Array.from(svg.querySelectorAll(ringSelector));
                if (!rings.length) return null;
                const outer = rings[0];
                const cx = parseFloat(outer.getAttribute("cx"));
                const cy = parseFloat(outer.getAttribute("cy"));
                const r = parseFloat(outer.getAttribute("r") || outer.getAttribute("rx"));
                return { cx, cy, r };
            }

            const orbitGroups = [
                collectOrbitGroups(".circle-glow-ring"),
                collectOrbitGroups(".circle-glow-ring2"),
                collectOrbitGroups(".circle-glow-ring3"),
            ].filter(Boolean);

            /* ---------------------------------------------------------
               2. Path pulse — clone the path, animate a short dash
                  segment along its length, then discard the clone.
            --------------------------------------------------------- */
            function firePathPulse(path) {
                const isMain = path.classList.contains("main-path");
                const color = isMain ? ORANGE : RED;

                let length;
                try {
                    length = path.getTotalLength();
                } catch (e) {
                    return;
                }
                if (!length || length < 1) return;

                const dashLength = Math.max(18, Math.min(60, length * 0.18));

                const clone = document.createElementNS(NS, "path");
                clone.setAttribute("d", path.getAttribute("d"));
                clone.classList.add("pulse-line");
                clone.style.stroke = color;
                clone.style.strokeWidth = isMain ? "2.2" : "1.6";
                clone.style.strokeDasharray = dashLength + " " + length;
                clone.style.strokeDashoffset = length;
                clone.style.filter = "drop-shadow(0 0 6px " + color + ")";
                clone.style.opacity = "0.95";
                clone.style.transition = "none";

                svg.appendChild(clone);

                // Force reflow so the browser registers the starting state before transitioning
                void clone.getBoundingClientRect();

                const duration = 650 + Math.random() * 500; // ms
                clone.style.transition = "stroke-dashoffset " + duration + "ms linear, opacity " + duration + "ms ease-out";

                requestAnimationFrame(() => {
                    clone.style.strokeDashoffset = -length;
                    clone.style.opacity = "0";
                });

                // Clean up: remove the pulse element completely once it finishes travelling
                setTimeout(() => {
                    if (clone.parentNode) clone.parentNode.removeChild(clone);
                }, duration + 80);
            }

            /* ---------------------------------------------------------
               3. Circle / ring pulse — a small orange spark orbiting
                  the ring using requestAnimationFrame, then removed.
            --------------------------------------------------------- */
            function fireCirclePulse(group) {
                if (!group) return;
                const { cx, cy, r } = group;

                const spark = document.createElementNS(NS, "circle");
                spark.classList.add("pulse-spark");
                spark.setAttribute("r", "3.2");
                spark.setAttribute("fill", ORANGE);
                spark.style.filter = "drop-shadow(0 0 6px " + ORANGE + ")";
                svg.appendChild(spark);

                const startAngle = Math.random() * Math.PI * 2;
                const loops = 1 + Math.random() * 0.6; // slightly more than one lap
                const duration = 900 + Math.random() * 500;
                const start = performance.now();

                function step(now) {
                    const t = Math.min(1, (now - start) / duration);
                    const angle = startAngle + t * loops * Math.PI * 2;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    spark.setAttribute("cx", x);
                    spark.setAttribute("cy", y);
                    spark.style.opacity = String(1 - t * 0.7);

                    if (t < 1) {
                        requestAnimationFrame(step);
                    } else if (spark.parentNode) {
                        spark.parentNode.removeChild(spark);
                    }
                }
                requestAnimationFrame(step);
            }

            /* ---------------------------------------------------------
               4. Randomized scheduler
               - random path chosen each time
               - random delay between currents
               - occasional bursts of 3-5 consecutive pulses on the same path
               - small chance of a circle/ring pulse instead of a path pulse
            --------------------------------------------------------- */
            function randomBetween(min, max) {
                return min + Math.random() * (max - min);
            }

            function pickRandomPath() {
                // Bias slightly toward main paths so the CPU feels "alive"
                const useMain = Math.random() < 0.55 && mainPaths.length;
                const pool = useMain ? mainPaths : secondaryPaths;
                if (!pool.length) return allPaths[Math.floor(Math.random() * allPaths.length)];
                return pool[Math.floor(Math.random() * pool.length)];
            }

            function pickRandomCircleGroup() {
                if (!orbitGroups.length) return null;
                return orbitGroups[Math.floor(Math.random() * orbitGroups.length)];
            }

            function scheduleNext() {
                // Realistic irregular timing: sometimes fast, sometimes a long lull
                const delay = randomBetween(300, 4200) + (Math.random() < 0.15 ? randomBetween(2000, 5000) : 0);

                setTimeout(() => {
                    const roll = Math.random();

                    if (roll < 0.12) {
                        // Occasional circle / ring pulse
                        fireCirclePulse(pickRandomCircleGroup());
                    } else if (roll < 0.35) {
                        // Burst: 3-5 consecutive pulses down the same path
                        const burstPath = pickRandomPath();
                        const burstCount = 3 + Math.floor(Math.random() * 3); // 3..5
                        let fired = 0;
                        function fireBurstStep() {
                            firePathPulse(burstPath);
                            fired++;
                            if (fired < burstCount) {
                                setTimeout(fireBurstStep, randomBetween(120, 380));
                            }
                        }
                        fireBurstStep();
                    } else {
                        // Single pulse on a random path
                        firePathPulse(pickRandomPath());
                    }

                    scheduleNext();
                }, delay);
            }

            // Kick things off once paths are laid out (getTotalLength needs layout)
            window.addEventListener("load", () => {
                // Prime a couple of pulses immediately so the board feels alive on load
                setTimeout(() => firePathPulse(pickRandomPath()), 200);
                setTimeout(() => firePathPulse(pickRandomPath()), 900);
                scheduleNext();
            });
        })();
    </script>
